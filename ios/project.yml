name: v2s-ios
options:
  minimumXcodeGenVersion: "2.46.0"
  createIntermediateGroups: true
  knownRegions:
    - en
    - zh-Hant
    - zh-Hans
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.0
targets:
  v2s-ios:
    type: application
    platform: iOS
    productName: v2s-ios
    sources:
      - path: ../Sources/V2SApp
        excludes:
          - "App/AppDelegate.swift"
          - "App/DockVisibilityController.swift"
          - "App/V2SApp.swift"
          - "Services/UpdaterService.swift"
          - "Services/MelongOmlxTranslationService.swift"
          - "Services/TranslateGemmaTranslationService.swift"
          - "Services/TibetanASREngine.swift"
          - "UI/StatusBar/**"
          - "UI/Overlay/**"
          - "UI/Settings/**"
      - path: Sources
      - path: Resources
        excludes:
          - "BreezeASR26/**"
          - "Acknowledgments/**"
        buildPhase: resources
      - path: Resources/BreezeASR26
        type: folder
        buildPhase: resources
      - path: Resources/Acknowledgments
        type: folder
        buildPhase: resources
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: org.audreyt.v2s.ios
        PRODUCT_MODULE_NAME: v2s_ios
        PRODUCT_NAME: Easy2say
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "51"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Easy2say
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Easy2say does not capture video. This declaration is required because its on-device audio framework links Apple's camera-capable capture API."
        NSMicrophoneUsageDescription: "Easy2say uses the microphone to generate live subtitles entirely on device."
        NSSpeechRecognitionUsageDescription: "Easy2say uses on-device speech recognition to transcribe audio into subtitles."
        ITSAppUsesNonExemptEncryption: false
schemes:
  v2s-ios:
    build:
      targets:
        v2s-ios: all
    run:
      config: Debug
