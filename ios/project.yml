name: v2s-ios
options:
  minimumXcodeGenVersion: "2.46.0"
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  v2s-ios:
    type: application
    platform: iOS
    productName: v2s-ios
    sources:
      - path: ../Sources/V2SApp
        excludes:
          - "App/AppDelegate.swift"
          - "App/DockVisibilityController.swift"
          - "App/V2SApp.swift"
          - "Services/UpdaterService.swift"
          - "UI/StatusBar/**"
          - "UI/Overlay/**"
          - "UI/Settings/**"
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: org.audreyt.v2s.ios
        PRODUCT_MODULE_NAME: v2s_ios
        PRODUCT_NAME: v2s-ios
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: v2s-ios
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "v2s-ios uses the microphone to generate live subtitles entirely on device."
        NSSpeechRecognitionUsageDescription: "v2s-ios uses on-device speech recognition to transcribe audio into subtitles."
        ITSAppUsesNonExemptEncryption: false
schemes:
  v2s-ios:
    build:
      targets:
        v2s-ios: all
    run:
      config: Debug
