name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Swift test
        run: swift test

      - name: Cache Breeze-ASR-26
        id: breeze-cache
        uses: actions/cache@v6
        with:
          path: ios/Resources/BreezeASR26
          key: breeze-asr-26-${{ runner.os }}-${{ hashFiles('scripts/fetch_breeze_asr_26.sh') }}

      - name: Install Hugging Face CLI
        if: steps.breeze-cache.outputs.cache-hit != 'true'
        run: brew install huggingface-cli

      - name: Fetch Breeze-ASR-26
        if: steps.breeze-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch_breeze_asr_26.sh

      - name: Verify Breeze-ASR-26
        run: ./scripts/fetch_breeze_asr_26.sh --verify-only

      - name: Build macOS app (Release)
        run: |
          xcodebuild \
            -project v2s.xcodeproj \
            -scheme v2s \
            -configuration Release \
            -derivedDataPath .build/release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Install XcodeGen
        # Homebrew stable is 2.46.0
        run: brew install xcodegen

      - name: Generate iOS project
        run: |
          cd ios
          xcodegen generate

      - name: Build iOS app (Simulator)
        run: |
          cd ios
          xcodebuild \
            -project v2s-ios.xcodeproj \
            -scheme v2s-ios \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test, lint, and build Android app
        working-directory: android
        run: ./gradlew --no-daemon test lint assembleDebug

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test documentation localization
        run: node --test Tests/Docs/i18n.test.cjs
